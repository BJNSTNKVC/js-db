name: Publish

on:
    release:
        types: [ published ]
    workflow_dispatch:

jobs:
    tests:
        name: Tests

        uses: ./.github/workflows/tests.yml

    publish:
        name: Publish to npm

        needs: tests

        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - run: npm install -g npm@11

            - run: npm ci

            - run: npm run build

            - run: npm publish --provenance --access public
