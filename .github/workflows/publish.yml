name: Publish

on:
    release:
        types: [ published ]
    workflow_dispatch:

jobs:
    publish:
        name: Publish to npm

        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - run: npm ci

            - run: npm run build

            - run: npm publish --access public
