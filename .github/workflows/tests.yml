name: Tests

on:
    push:
        branches: [ '**' ]
    pull_request:

jobs:
    test:
        name: Node v${{ matrix.node }}

        runs-on: ubuntu-latest

        strategy:
            matrix:
                node: [ 22, 24 ]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - run: npm run typecheck

            - run: npm run coverage

            - run: npm run build

    browser:
        name: Browsers (${{ matrix.engine }})

        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                engine: [ Chromium, Firefox, WebKit ]

        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble
            options: --user 1001

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npx vitest run --project "Browser (${{ matrix.engine }}*" --passWithNoTests
